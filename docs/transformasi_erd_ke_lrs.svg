<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 30px Arial, sans-serif;fill:#162033}.sub{font:400 15px Arial, sans-serif;fill:#586274}
      .box{fill:#fff;stroke:#27364f;stroke-width:2;rx:8}.erd{fill:#fff7e8;stroke:#b58105;stroke-width:2;rx:8}
      .rule{fill:#edf7ff;stroke:#1976a3;stroke-width:2;rx:8}.lrs{fill:#f2fff0;stroke:#3b7f35;stroke-width:2;rx:8}
      .head{font:700 18px Arial, sans-serif;fill:#162033}.txt{font:14px Arial, sans-serif;fill:#1f2a3d}.code{font:13px Consolas, monospace;fill:#162033}
      .arrow{stroke:#52647a;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.mini{font:12px Arial, sans-serif;fill:#586274}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52647a"/>
    </marker>
  </defs>
  <rect class="bg" width="1400" height="900"/>
  <text x="50" y="55" class="title">Transformasi ERD ke LRS - Digi Herba</text>
  <text x="50" y="82" class="sub">Alur perubahan konsep entitas dan relasi menjadi struktur tabel relasional yang dipakai migration Laravel.</text>

  <text x="115" y="130" class="head">ERD</text>
  <text x="585" y="130" class="head">Aturan Transformasi</text>
  <text x="1050" y="130" class="head">LRS</text>

  <g transform="translate(70 160)">
    <rect class="erd" width="330" height="88"/>
    <text x="18" y="32" class="txt">Entitas USERS</text>
    <text x="18" y="58" class="code">id, email, password, status</text>
  </g>
  <g transform="translate(535 160)">
    <rect class="rule" width="330" height="88"/>
    <text x="18" y="32" class="txt">Entitas menjadi tabel</text>
    <text x="18" y="58" class="txt">Atribut menjadi kolom</text>
  </g>
  <g transform="translate(1000 160)">
    <rect class="lrs" width="330" height="88"/>
    <text x="18" y="32" class="txt">USERS</text>
    <text x="18" y="58" class="code">PK id, UK email, status</text>
  </g>
  <path class="arrow" d="M400 204 H535"/><path class="arrow" d="M865 204 H1000"/>

  <g transform="translate(70 290)">
    <rect class="erd" width="330" height="96"/>
    <text x="18" y="32" class="txt">Relasi 1:N</text>
    <text x="18" y="58" class="code">USERS -> USER_PROVIDERS</text>
    <text x="18" y="80" class="mini">Satu user punya banyak provider login</text>
  </g>
  <g transform="translate(535 290)">
    <rect class="rule" width="330" height="96"/>
    <text x="18" y="32" class="txt">FK diletakkan pada sisi N</text>
    <text x="18" y="58" class="code">user_id references users.id</text>
  </g>
  <g transform="translate(1000 290)">
    <rect class="lrs" width="330" height="96"/>
    <text x="18" y="32" class="txt">USER_PROVIDERS</text>
    <text x="18" y="58" class="code">PK id, FK user_id</text>
    <text x="18" y="80" class="code">provider, provider_id</text>
  </g>
  <path class="arrow" d="M400 338 H535"/><path class="arrow" d="M865 338 H1000"/>

  <g transform="translate(70 430)">
    <rect class="erd" width="330" height="106"/>
    <text x="18" y="32" class="txt">Relasi N:M</text>
    <text x="18" y="58" class="code">USERS &lt;-&gt; ROLES</text>
    <text x="18" y="80" class="code">USERS &lt;-&gt; PERMISSIONS</text>
  </g>
  <g transform="translate(535 430)">
    <rect class="rule" width="330" height="106"/>
    <text x="18" y="32" class="txt">Relasi N:M menjadi tabel junction</text>
    <text x="18" y="58" class="code">PK gabungan dari FK</text>
    <text x="18" y="80" class="code">model_type + model_id untuk Spatie</text>
  </g>
  <g transform="translate(1000 430)">
    <rect class="lrs" width="330" height="106"/>
    <text x="18" y="32" class="txt">MODEL_HAS_ROLES</text>
    <text x="18" y="58" class="code">role_id, model_type, model_id</text>
    <text x="18" y="82" class="txt">MODEL_HAS_PERMISSIONS</text>
  </g>
  <path class="arrow" d="M400 483 H535"/><path class="arrow" d="M865 483 H1000"/>

  <g transform="translate(70 585)">
    <rect class="erd" width="330" height="96"/>
    <text x="18" y="32" class="txt">Relasi N:M</text>
    <text x="18" y="58" class="code">ROLES &lt;-&gt; PERMISSIONS</text>
  </g>
  <g transform="translate(535 585)">
    <rect class="rule" width="330" height="96"/>
    <text x="18" y="32" class="txt">Buat bridge table</text>
    <text x="18" y="58" class="code">role_id + permission_id</text>
  </g>
  <g transform="translate(1000 585)">
    <rect class="lrs" width="330" height="96"/>
    <text x="18" y="32" class="txt">ROLE_HAS_PERMISSIONS</text>
    <text x="18" y="58" class="code">PK/FK role_id</text>
    <text x="18" y="80" class="code">PK/FK permission_id</text>
  </g>
  <path class="arrow" d="M400 633 H535"/><path class="arrow" d="M865 633 H1000"/>

  <g transform="translate(70 730)">
    <rect class="erd" width="330" height="96"/>
    <text x="18" y="32" class="txt">Relasi polymorphic</text>
    <text x="18" y="58" class="code">USERS -> MEDIA / NOTIFICATIONS</text>
  </g>
  <g transform="translate(535 730)">
    <rect class="rule" width="330" height="96"/>
    <text x="18" y="32" class="txt">Simpan type dan id model</text>
    <text x="18" y="58" class="code">model_type + model_id</text>
    <text x="18" y="80" class="code">notifiable_type + notifiable_id</text>
  </g>
  <g transform="translate(1000 730)">
    <rect class="lrs" width="330" height="96"/>
    <text x="18" y="32" class="txt">MEDIA, NOTIFICATIONS</text>
    <text x="18" y="58" class="code">type column stores class name</text>
    <text x="18" y="80" class="code">id column stores related record</text>
  </g>
  <path class="arrow" d="M400 778 H535"/><path class="arrow" d="M865 778 H1000"/>
</svg>
