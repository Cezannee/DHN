<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1380" viewBox="0 0 920 1380">
  <defs>
    <style>
      .page{fill:#fff}
      .title{font:700 21px "Times New Roman", serif;fill:#000}
      .body{font:18px "Times New Roman", serif;fill:#000}
      .caption{font:italic 18px "Times New Roman", serif;fill:#000}
      .head{font:700 17px "Times New Roman", serif;fill:#000}
      .cell{font:17px "Times New Roman", serif;fill:#000}
      .line{stroke:#000;stroke-width:1;shape-rendering:crispEdges}
    </style>
  </defs>

  <rect class="page" width="920" height="1380"/>

  <text x="28" y="36" class="title">3.6 Perancangan Basis Data</text>
  <text x="28" y="72" class="body">Perancangan basis data dilakukan untuk menentukan struktur tabel, kolom, dan relasi data yang</text>
  <text x="28" y="102" class="body">diperlukan. Struktur basis data disusun agar data pengguna, hak akses, media, notifikasi,</text>
  <text x="28" y="132" class="body">aktivitas sistem, serta proses antrian dapat disimpan dan dikelola secara dinamis.</text>

  <text x="328" y="171" class="caption">Tabel 3.5 Rancangan tabel basis data</text>

  <!-- Table geometry -->
  <g transform="translate(30 185)">
    <rect x="0" y="0" width="860" height="1139" fill="#fff" stroke="#000" stroke-width="1"/>

    <!-- Column boundaries -->
    <line class="line" x1="55" y1="0" x2="55" y2="1139"/>
    <line class="line" x1="235" y1="0" x2="235" y2="1139"/>
    <line class="line" x1="590" y1="0" x2="590" y2="1139"/>

    <!-- Row boundaries -->
    <line class="line" x1="0" y1="32" x2="860" y2="32"/>
    <line class="line" x1="0" y1="96" x2="860" y2="96"/>
    <line class="line" x1="0" y1="160" x2="860" y2="160"/>
    <line class="line" x1="0" y1="224" x2="860" y2="224"/>
    <line class="line" x1="0" y1="288" x2="860" y2="288"/>
    <line class="line" x1="0" y1="352" x2="860" y2="352"/>
    <line class="line" x1="0" y1="416" x2="860" y2="416"/>
    <line class="line" x1="0" y1="480" x2="860" y2="480"/>
    <line class="line" x1="0" y1="544" x2="860" y2="544"/>
    <line class="line" x1="0" y1="608" x2="860" y2="608"/>
    <line class="line" x1="0" y1="672" x2="860" y2="672"/>
    <line class="line" x1="0" y1="748" x2="860" y2="748"/>
    <line class="line" x1="0" y1="812" x2="860" y2="812"/>
    <line class="line" x1="0" y1="876" x2="860" y2="876"/>
    <line class="line" x1="0" y1="940" x2="860" y2="940"/>
    <line class="line" x1="0" y1="1004" x2="860" y2="1004"/>
    <line class="line" x1="0" y1="1068" x2="860" y2="1068"/>

    <!-- Header -->
    <text x="18" y="22" class="head">No.</text>
    <text x="103" y="22" class="head">Nama Tabel</text>
    <text x="360" y="22" class="head">Kolom Utama</text>
    <text x="705" y="22" class="head">Keterangan</text>

    <!-- Row 1 -->
    <text x="18" y="68" class="cell">1</text>
    <text x="70" y="68" class="cell">users</text>
    <text x="250" y="58" class="cell">id, username, name, email, password,</text>
    <text x="250" y="82" class="cell">status, created_by, updated_by</text>
    <text x="605" y="58" class="cell">Menyimpan data</text>
    <text x="605" y="82" class="cell">pengguna aplikasi.</text>

    <!-- Row 2 -->
    <text x="18" y="132" class="cell">2</text>
    <text x="70" y="132" class="cell">sessions</text>
    <text x="250" y="122" class="cell">id, user_id, ip_address, user_agent,</text>
    <text x="250" y="146" class="cell">payload, last_activity</text>
    <text x="605" y="122" class="cell">Menyimpan data</text>
    <text x="605" y="146" class="cell">session pengguna.</text>

    <!-- Row 3 -->
    <text x="18" y="196" class="cell">3</text>
    <text x="70" y="196" class="cell">password_reset_tokens</text>
    <text x="250" y="186" class="cell">email, token, created_at</text>
    <text x="605" y="186" class="cell">Menyimpan token</text>
    <text x="605" y="210" class="cell">reset password.</text>

    <!-- Row 4 -->
    <text x="18" y="260" class="cell">4</text>
    <text x="70" y="260" class="cell">user_providers</text>
    <text x="250" y="250" class="cell">id, user_id, provider, provider_id,</text>
    <text x="250" y="274" class="cell">avatar</text>
    <text x="605" y="250" class="cell">Menyimpan akun</text>
    <text x="605" y="274" class="cell">login sosial pengguna.</text>

    <!-- Row 5 -->
    <text x="18" y="324" class="cell">5</text>
    <text x="70" y="324" class="cell">roles</text>
    <text x="250" y="314" class="cell">id, name, guard_name, created_at,</text>
    <text x="250" y="338" class="cell">updated_at</text>
    <text x="605" y="314" class="cell">Menyimpan daftar</text>
    <text x="605" y="338" class="cell">peran pengguna.</text>

    <!-- Row 6 -->
    <text x="18" y="388" class="cell">6</text>
    <text x="70" y="388" class="cell">permissions</text>
    <text x="250" y="378" class="cell">id, name, guard_name, created_at,</text>
    <text x="250" y="402" class="cell">updated_at</text>
    <text x="605" y="378" class="cell">Menyimpan daftar</text>
    <text x="605" y="402" class="cell">hak akses sistem.</text>

    <!-- Row 7 -->
    <text x="18" y="452" class="cell">7</text>
    <text x="70" y="452" class="cell">model_has_roles</text>
    <text x="250" y="442" class="cell">role_id, model_type, model_id</text>
    <text x="605" y="442" class="cell">Menghubungkan</text>
    <text x="605" y="466" class="cell">pengguna dengan role.</text>

    <!-- Row 8 -->
    <text x="18" y="516" class="cell">8</text>
    <text x="70" y="516" class="cell">model_has_permissions</text>
    <text x="250" y="506" class="cell">permission_id, model_type, model_id</text>
    <text x="605" y="506" class="cell">Menghubungkan</text>
    <text x="605" y="530" class="cell">pengguna dengan izin.</text>

    <!-- Row 9 -->
    <text x="18" y="580" class="cell">9</text>
    <text x="70" y="580" class="cell">role_has_permissions</text>
    <text x="250" y="570" class="cell">permission_id, role_id</text>
    <text x="605" y="570" class="cell">Menghubungkan role</text>
    <text x="605" y="594" class="cell">dengan permission.</text>

    <!-- Row 10 -->
    <text x="12" y="644" class="cell">10</text>
    <text x="70" y="644" class="cell">media</text>
    <text x="250" y="634" class="cell">id, model_type, model_id, uuid,</text>
    <text x="250" y="658" class="cell">collection_name, file_name, size</text>
    <text x="605" y="634" class="cell">Menyimpan file</text>
    <text x="605" y="658" class="cell">atau gambar sistem.</text>

    <!-- Row 11 -->
    <text x="12" y="712" class="cell">11</text>
    <text x="70" y="712" class="cell">notifications</text>
    <text x="250" y="698" class="cell">id, type, notifiable_type,</text>
    <text x="250" y="722" class="cell">notifiable_id, data, read_at</text>
    <text x="605" y="698" class="cell">Menyimpan notifikasi</text>
    <text x="605" y="722" class="cell">untuk pengguna.</text>

    <!-- Row 12 -->
    <text x="12" y="780" class="cell">12</text>
    <text x="70" y="780" class="cell">activity_log</text>
    <text x="250" y="766" class="cell">id, log_name, description, subject_id,</text>
    <text x="250" y="790" class="cell">causer_id, event, properties</text>
    <text x="605" y="766" class="cell">Menyimpan riwayat</text>
    <text x="605" y="790" class="cell">aktivitas sistem.</text>

    <!-- Row 13 -->
    <text x="12" y="844" class="cell">13</text>
    <text x="70" y="844" class="cell">jobs</text>
    <text x="250" y="834" class="cell">id, queue, payload, attempts,</text>
    <text x="250" y="858" class="cell">reserved_at, available_at</text>
    <text x="605" y="834" class="cell">Menyimpan antrian</text>
    <text x="605" y="858" class="cell">pekerjaan sistem.</text>

    <!-- Row 14 -->
    <text x="12" y="908" class="cell">14</text>
    <text x="70" y="908" class="cell">job_batches</text>
    <text x="250" y="898" class="cell">id, name, total_jobs, pending_jobs,</text>
    <text x="250" y="922" class="cell">failed_jobs, options, finished_at</text>
    <text x="605" y="898" class="cell">Menyimpan batch</text>
    <text x="605" y="922" class="cell">proses antrian.</text>

    <!-- Row 15 -->
    <text x="12" y="972" class="cell">15</text>
    <text x="70" y="972" class="cell">failed_jobs</text>
    <text x="250" y="962" class="cell">id, uuid, connection, queue,</text>
    <text x="250" y="986" class="cell">payload, exception, failed_at</text>
    <text x="605" y="962" class="cell">Menyimpan data job</text>
    <text x="605" y="986" class="cell">yang gagal diproses.</text>

    <!-- Row 16 -->
    <text x="12" y="1036" class="cell">16</text>
    <text x="70" y="1036" class="cell">cache</text>
    <text x="250" y="1026" class="cell">key, value, expiration</text>
    <text x="605" y="1026" class="cell">Menyimpan data</text>
    <text x="605" y="1050" class="cell">cache aplikasi.</text>

    <!-- Row 17 -->
    <text x="12" y="1100" class="cell">17</text>
    <text x="70" y="1100" class="cell">cache_locks</text>
    <text x="250" y="1090" class="cell">key, owner, expiration</text>
    <text x="605" y="1090" class="cell">Menyimpan lock</text>
    <text x="605" y="1114" class="cell">untuk proses cache.</text>
  </g>
</svg>
