<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <defs>
    <style>
      .bg{fill:#f7f8fb}.title{font:700 30px Arial, sans-serif;fill:#162033}.sub{font:400 15px Arial, sans-serif;fill:#586274}
      .entity{fill:#fff;stroke:#253858;stroke-width:2;rx:8}.head{fill:#253858}.headText{font:700 15px Arial, sans-serif;fill:#fff}
      .field{font:13px Consolas, monospace;fill:#162033}.note{font:12px Arial, sans-serif;fill:#586274}
      .rel{stroke:#52647a;stroke-width:2;fill:none}.dash{stroke-dasharray:7 6}.label{font:12px Arial, sans-serif;fill:#253858}
      .junction{fill:#fffdf2;stroke:#b58105;stroke-width:2;rx:8}.poly{fill:#f4fbff;stroke:#1976a3;stroke-width:2;rx:8}
      .sys{fill:#f7fff4;stroke:#3b7f35;stroke-width:2;rx:8}
    </style>
  </defs>
  <rect class="bg" width="1400" height="1000"/>
  <text x="50" y="55" class="title">Entity Relationship Diagram (ERD) - Digi Herba</text>
  <text x="50" y="82" class="sub">Berdasarkan migration Laravel: auth, role/permission Spatie, media, notification, activity log, queue, dan cache.</text>

  <g transform="translate(510 130)">
    <rect class="entity" width="360" height="292"/>
    <rect class="head" width="360" height="38" rx="8"/>
    <text x="18" y="25" class="headText">USERS</text>
    <text x="18" y="64" class="field">PK id</text>
    <text x="18" y="86" class="field">UK email, username</text>
    <text x="18" y="108" class="field">name, first_name, last_name</text>
    <text x="18" y="130" class="field">password, remember_token</text>
    <text x="18" y="152" class="field">mobile, gender, date_of_birth</text>
    <text x="18" y="174" class="field">address, bio, social_profiles, avatar</text>
    <text x="18" y="196" class="field">status, last_ip, login_count, last_login</text>
    <text x="18" y="218" class="field">FK created_by -> users.id</text>
    <text x="18" y="240" class="field">FK updated_by -> users.id</text>
    <text x="18" y="262" class="field">FK deleted_by -> users.id</text>
  </g>

  <g transform="translate(80 145)">
    <rect class="entity" width="280" height="138"/>
    <rect class="head" width="280" height="36" rx="8"/>
    <text x="16" y="24" class="headText">SESSIONS</text>
    <text x="16" y="62" class="field">PK id</text>
    <text x="16" y="84" class="field">FK user_id -> users.id</text>
    <text x="16" y="106" class="field">ip_address, user_agent</text>
    <text x="16" y="128" class="field">payload, last_activity</text>
  </g>

  <g transform="translate(80 330)">
    <rect class="entity" width="280" height="130"/>
    <rect class="head" width="280" height="36" rx="8"/>
    <text x="16" y="24" class="headText">USER_PROVIDERS</text>
    <text x="16" y="62" class="field">PK id</text>
    <text x="16" y="84" class="field">FK user_id -> users.id</text>
    <text x="16" y="106" class="field">provider, provider_id</text>
    <text x="16" y="128" class="field">avatar, timestamps</text>
  </g>

  <g transform="translate(1010 135)">
    <rect class="entity" width="270" height="118"/>
    <rect class="head" width="270" height="36" rx="8"/>
    <text x="16" y="24" class="headText">ROLES</text>
    <text x="16" y="62" class="field">PK id</text>
    <text x="16" y="84" class="field">UK name + guard_name</text>
    <text x="16" y="106" class="field">timestamps</text>
  </g>

  <g transform="translate(1010 320)">
    <rect class="entity" width="270" height="118"/>
    <rect class="head" width="270" height="36" rx="8"/>
    <text x="16" y="24" class="headText">PERMISSIONS</text>
    <text x="16" y="62" class="field">PK id</text>
    <text x="16" y="84" class="field">UK name + guard_name</text>
    <text x="16" y="106" class="field">timestamps</text>
  </g>

  <g transform="translate(500 500)">
    <rect class="junction" width="310" height="112"/>
    <rect class="head" width="310" height="36" rx="8"/>
    <text x="16" y="24" class="headText">MODEL_HAS_ROLES</text>
    <text x="16" y="62" class="field">PK/FK role_id -> roles.id</text>
    <text x="16" y="84" class="field">PK model_id, model_type</text>
    <text x="16" y="106" class="field">model_type = App\Models\User</text>
  </g>

  <g transform="translate(500 650)">
    <rect class="junction" width="340" height="112"/>
    <rect class="head" width="340" height="36" rx="8"/>
    <text x="16" y="24" class="headText">MODEL_HAS_PERMISSIONS</text>
    <text x="16" y="62" class="field">PK/FK permission_id -> permissions.id</text>
    <text x="16" y="84" class="field">PK model_id, model_type</text>
    <text x="16" y="106" class="field">model_type = App\Models\User</text>
  </g>

  <g transform="translate(950 560)">
    <rect class="junction" width="330" height="96"/>
    <rect class="head" width="330" height="36" rx="8"/>
    <text x="16" y="24" class="headText">ROLE_HAS_PERMISSIONS</text>
    <text x="16" y="62" class="field">PK/FK role_id -> roles.id</text>
    <text x="16" y="84" class="field">PK/FK permission_id -> permissions.id</text>
  </g>

  <g transform="translate(85 555)">
    <rect class="poly" width="315" height="116"/>
    <rect class="head" width="315" height="36" rx="8"/>
    <text x="16" y="24" class="headText">MEDIA</text>
    <text x="16" y="62" class="field">PK id, UK uuid</text>
    <text x="16" y="84" class="field">model_type, model_id</text>
    <text x="16" y="106" class="field">file metadata, json metadata</text>
  </g>

  <g transform="translate(85 720)">
    <rect class="poly" width="315" height="116"/>
    <rect class="head" width="315" height="36" rx="8"/>
    <text x="16" y="24" class="headText">NOTIFICATIONS</text>
    <text x="16" y="62" class="field">PK id UUID</text>
    <text x="16" y="84" class="field">notifiable_type, notifiable_id</text>
    <text x="16" y="106" class="field">type, data, read_at</text>
  </g>

  <g transform="translate(500 815)">
    <rect class="poly" width="350" height="116"/>
    <rect class="head" width="350" height="36" rx="8"/>
    <text x="16" y="24" class="headText">ACTIVITY_LOG</text>
    <text x="16" y="62" class="field">PK id</text>
    <text x="16" y="84" class="field">subject_type/id, causer_type/id</text>
    <text x="16" y="106" class="field">event, properties, batch_uuid</text>
  </g>

  <g transform="translate(1010 735)">
    <rect class="sys" width="270" height="150"/>
    <rect class="head" width="270" height="36" rx="8"/>
    <text x="16" y="24" class="headText">SYSTEM TABLES</text>
    <text x="16" y="62" class="field">password_reset_tokens</text>
    <text x="16" y="84" class="field">cache, cache_locks</text>
    <text x="16" y="106" class="field">jobs, job_batches</text>
    <text x="16" y="128" class="field">failed_jobs</text>
  </g>

  <path class="rel" d="M510 210 H360"/><text x="385" y="198" class="label">1 : N</text>
  <path class="rel" d="M510 360 H360"/><text x="385" y="348" class="label">1 : N</text>
  <path class="rel" d="M690 422 V500"/><text x="705" y="468" class="label">N : M via junction</text>
  <path class="rel" d="M870 185 H1010"/><text x="910" y="174" class="label">N : M</text>
  <path class="rel" d="M870 340 H1010"/><text x="910" y="329" class="label">direct permission</text>
  <path class="rel" d="M810 556 H950"/><text x="845" y="544" class="label">role permission</text>
  <path class="rel" d="M840 706 H950 V656"/><text x="855" y="696" class="label">permission bridge</text>
  <path class="rel dash" d="M510 405 C410 470 420 560 400 613"/><text x="408" y="548" class="label">polymorphic</text>
  <path class="rel dash" d="M510 420 C390 520 415 715 400 778"/><text x="408" y="704" class="label">polymorphic</text>
  <path class="rel dash" d="M690 422 V815"/><text x="710" y="792" class="label">subject / causer</text>
  <path class="rel dash" d="M870 265 C930 260 930 820 1010 810"/><text x="910" y="805" class="label">independent system data</text>

  <text x="50" y="955" class="note">Keterangan: tabel kuning = junction/bridge; tabel biru muda = relasi polymorphic Laravel; sistem tables tidak memiliki FK utama ke domain aplikasi.</text>
</svg>
